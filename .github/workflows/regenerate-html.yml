name: Regenerate html/ and publish it and the Oxygen builds to gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'static/**'
      - 'scripts/extract_to_csv.py'
      - 'scripts/deduplicate_csv.py'
      - 'scripts/generate_dita.py'
      - 'scripts/publish_html.py'
      - 'scripts/vendor/**'
      - 'requirements.txt'
      - '.github/workflows/regenerate-html.yml'
      # The committed Oxygen builds are copied to gh-pages verbatim (see the
      # "Sync the Oxygen builds" step). Nothing here rebuilds them - the
      # WebHelp CLI needs a licence this project does not have - so a change
      # under published/ means someone republished from Oxygen by hand and
      # the site should pick that up. It does re-run the DITA-OT build above
      # for a publish-only change, which is wasted work but keeps one writer
      # to gh-pages instead of two racing for the same branch.
      - 'demo/oxygen-sample/published/**'
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  DITA_OT_VERSION: 4.2.4

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r main-checkout/requirements.txt

      - name: Set up Java (for DITA-OT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache DITA-OT
        id: cache-dita-ot
        uses: actions/cache@v4
        with:
          path: dita-ot-${{ env.DITA_OT_VERSION }}
          key: dita-ot-${{ env.DITA_OT_VERSION }}

      - name: Download DITA-OT
        if: steps.cache-dita-ot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fSL -o dita-ot.zip \
            "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          unzip -q dita-ot.zip
          rm dita-ot.zip
          chmod +x "dita-ot-${DITA_OT_VERSION}/bin/dita"

      # source.csv was dropped from VCS (it is a pipeline intermediate);
      # regenerate it from the committed mock corpus instead.
      - name: Extract CSV from the mock corpus
        working-directory: main-checkout
        run: |
          python scripts/extract_to_csv.py \
            --input-root source/ \
            --out source.csv

      - name: Renumber within-week gram collisions
        working-directory: main-checkout
        run: |
          python scripts/deduplicate_csv.py \
            --csv source.csv \
            --image-root source/ \
            --out source.dedup.csv

      - name: Generate DITA
        working-directory: main-checkout
        run: |
          python scripts/generate_dita.py \
            --csv source.dedup.csv \
            --out dita/ \
            --image-root source/

      - name: Publish DITA tree to HTML
        working-directory: main-checkout
        # SOURCE_DATE_EPOCH pins the landing-page timestamp to the source
        # commit, so re-running the workflow over an unchanged tree produces
        # byte-identical HTML and the gh-pages sync commits nothing.
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/publish_html.py \
            --dita-ot "${GITHUB_WORKSPACE}/dita-ot-${DITA_OT_VERSION}"

      - name: Verify publish is byte-deterministic (second run, tree compare)
        working-directory: main-checkout
        # The determinism invariant (FR-008/SC-006): two consecutive publish
        # runs over an unchanged source yield byte-identical HTML in every
        # edition. This replaces the retired Jest sha256-snapshot test, which
        # needed a committed html/ tree to compare against.
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/publish_html.py \
            --dita-ot "${GITHUB_WORKSPACE}/dita-ot-${DITA_OT_VERSION}" \
            --out html-verify --staged .dita-build-verify
          diff -r html html-verify
          rm -rf html-verify

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Sync html/ into gh-pages
        run: |
          set -euo pipefail
          rm -rf gh-pages-checkout/html
          mkdir -p gh-pages-checkout/html
          cp -R main-checkout/html/. gh-pages-checkout/html/

      # A straight copy of the committed builds, not a build: Oxygen is the
      # production renderer and its WebHelp CLI is licensed, so these trees are
      # produced by hand and committed. published/index.html comes across with
      # them and is the entry point over all four editions.
      - name: Sync the Oxygen builds into gh-pages
        run: |
          set -euo pipefail
          rm -rf gh-pages-checkout/oxygen
          mkdir -p gh-pages-checkout/oxygen
          cp -R main-checkout/demo/oxygen-sample/published/. gh-pages-checkout/oxygen/
          # Pages is case-sensitive where Windows is not, and these trees are
          # published from a Windows host. A missing entry point is the one
          # breakage worth failing the run for.
          for page in oxygen/index.html \
                      oxygen/instructor/main/index.html \
                      oxygen/student/main/index.html; do
            test -f "gh-pages-checkout/${page}" || {
              echo "expected ${page} in the copied Oxygen tree" >&2
              exit 1
            }
          done

      - name: Ensure links on gh-pages index
        run: |
          set -euo pipefail
          cd gh-pages-checkout
          if ! grep -q 'href="html/"' index.html; then
            sed -i 's|  </ul>|    <li><a href="html/">Published HTML output</a> \&mdash; generated HTML view of the DITA pipeline output.</li>\n  </ul>|' index.html
          fi
          if ! grep -q 'href="oxygen/"' index.html; then
            sed -i 's|  </ul>|    <li><a href="oxygen/">Oxygen WebHelp publications</a> \&mdash; instructor and student editions of each publication, from the production renderer.</li>\n  </ul>|' index.html
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gh-pages-checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync html/ and oxygen/ from ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4; do
            if git push origin gh-pages; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin gh-pages
          done
          echo "push failed after retries" >&2
          exit 1
